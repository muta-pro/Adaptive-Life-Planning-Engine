[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skrov"
version = "0.1.0"
description = "A deterministic life-rhythm scheduling research engine"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
skrov = "skrov.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
